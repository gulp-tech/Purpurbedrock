# Per-player prefetch: Bedrock does not send the text currently being typed.
# Work is shared across players; a single third-party callback cannot be interrupted.
refresh-ticks: 1200
queries-per-tick: 2
budget-millis-per-tick: 1.0
slow-query-millis: 10.0
max-depth: 3
max-nodes-per-command: 16
max-candidates-per-node: 32
# Old unmodified 128/128/1024 defaults are used as 512/512/4096 at runtime.
# Set this to false to keep the old limits, or customize any of the three values.
# Query/tick budgets and slow-completer protection remain unchanged.
upgrade-legacy-default-capacity: true
max-commands-per-player: 512
max-total-nodes-per-player: 512
max-total-candidates-per-player: 4096
max-branches-per-command: 16
max-candidate-length: 96
include-commands: []
exclude-commands: [geyser, pbtabs, help]
prefix-probes: []
extra-contexts: {}
