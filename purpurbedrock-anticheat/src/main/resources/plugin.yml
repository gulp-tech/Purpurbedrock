name: PurpurBedrockAC
version: "26.2.1"
main: org.purpurmc.purpur.anticheat.PurpurBedrockACPlugin
api-version: "26.2"
folia-supported: false
authors:
  - Purpurbedrock
description: "Адаптивный античит под Purpurbedrock 26.2 и механику Geyser (21 модуль, 0 ложных киков, спящий режим, голограмма AVG, меню HolyWorld)"

commands:
  purpurac:
    description: "Управление античитом PurpurBedrockAC 26.2"
    aliases: [pac, anticheat, ac]
    usage: "/pac <alerts|holo|menu|checks|toggle|autopunish|history|info|status|reset|reload>"

permissions:
  purpurac.alerts:
    description: "Право на получение и переключение алертов античита (/pac alerts)"
    default: op
  purpurac.hologram:
    description: "Право на отображение небольшой голограммы AVG над игроками (/pac holo)"
    default: op
  purpurac.menu:
    description: "Право на открытие меню мониторинга и истории игрока HolyWorld (/pac menu, /pac history)"
    default: op
  purpurac.admin:
    description: "Полное управление античитом (/pac checks, /pac toggle, /pac autopunish, /pac reset, /pac reload)"
    default: op
    children:
      purpurac.alerts: true
      purpurac.hologram: true
      purpurac.menu: true
  purpurac.bypass:
    description: "Обход проверок античита (по умолчанию выключен в config.yml)"
    default: false
