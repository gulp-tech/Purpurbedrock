name: PurpurBedrockAC
version: '26.2.0'
main: org.purpurmc.purpur.anticheat.PurpurBedrockACPlugin
api-version: '26.2'
author: Purpurbedrock
description: Высокооптимизированный адаптивный античит специально под ядро Purpurbedrock 26.2
softdepend:
  - PlaceholderAPI
  - Geyser-Spigot
commands:
  purpurac:
    description: Управление античитом PurpurBedrockAC (алерты, голограмма AVG, меню истории HolyWorld)
    usage: /pac [alerts | holo | menu | history <игрок> | info <игрок> | reset <игрок> | status | reload]
    aliases:
      - pac
      - anticheat
      - bac
permissions:
  purpurac.alerts:
    description: Право получать и переключать алерты античита (/pac alerts)
    default: op
  purpurac.hologram:
    description: Право включать и выключать голограмму AVG над игроками (/pac holo)
    default: op
  purpurac.menu:
    description: Право открывать меню истории и проверок в стиле HolyWorld (/pac menu, /pac history)
    default: op
  purpurac.bypass:
    description: Обход проверок античита (по умолчанию выключен даже у OP, если bypass-enabled=false)
    default: false
  purpurac.admin:
    description: Полный доступ администратора к античиту (/pac reload, /pac reset, /pac status)
    default: op
    children:
      purpurac.alerts: true
      purpurac.hologram: true
      purpurac.menu: true
