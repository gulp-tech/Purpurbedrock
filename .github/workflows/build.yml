name: Build Purpurbedrock 26.2 Core
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "ver/**"
      - "arena/**"
      - "main"

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 & 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Git identity for Paperweight
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"

      - name: Build Self-Contained Bedrock 26.2 Protocol Engine (Zero External Dependencies)
        id: build_bedrock_engine
        run: |
          set -euo pipefail
          {
            echo "=== Cloning Geyser 26.2 source (bbd7e67) for internal Purpurbedrock protocol engine ==="
            rm -rf /tmp/geyser-26.2
            git clone https://github.com/GeyserMC/Geyser.git /tmp/geyser-26.2
            git -C /tmp/geyser-26.2 checkout bbd7e67
            git -C /tmp/geyser-26.2 submodule update --init --recursive --depth 1

            echo "=== Applying Purpurbedrock 26.2 protocol engine patches ==="
            python3 "$GITHUB_WORKSPACE/scripts/patch-bedrock-engine.py" /tmp/geyser-26.2

            echo "=== Compiling internal purpurbedrock-protocol.jar ==="
            gradle -p /tmp/geyser-26.2 :spigot:shadowJar --no-daemon --stacktrace

            PROTO_JAR=$(find /tmp/geyser-26.2/bootstrap/spigot/build/libs -maxdepth 1 -name "Geyser-Spigot*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
            if [ -z "$PROTO_JAR" ]; then
              echo "ERROR: Compiled protocol engine JAR not found!"
              exit 1
            fi
            mkdir -p "$GITHUB_WORKSPACE/purpur-server/src/main/resources/META-INF/bedrock"
            cp "$PROTO_JAR" "$GITHUB_WORKSPACE/purpur-server/src/main/resources/META-INF/bedrock/purpurbedrock-protocol.jar"
            ls -lh "$GITHUB_WORKSPACE/purpur-server/src/main/resources/META-INF/bedrock/purpurbedrock-protocol.jar"
          } 2>&1 | tee /tmp/build.log

      - name: Apply Purpurbedrock 26.2 Patches & Build Paperclip Server Core JAR
        id: gradle_build
        run: |
          set -euo pipefail
          {
            gradle applyAllPatches --stacktrace
            echo 'include(":test-plugin")' > test-plugin.settings.gradle.kts
            gradle createPaperclipJar :test-plugin:jar --stacktrace

            ls -la purpur-server/build/libs/
            PAPERCLIP_JAR=$(find purpur-server/build/libs -maxdepth 1 -name "*paperclip*.jar" | head -n 1)
            if [ -z "$PAPERCLIP_JAR" ]; then
              echo "No paperclip jar found!"
              exit 1
            fi
            cp "$PAPERCLIP_JAR" purpurbedrock-26.2.jar
            sha256sum purpurbedrock-26.2.jar > purpurbedrock-26.2.jar.sha256
            ls -lh purpurbedrock-26.2.jar purpurbedrock-26.2.jar.sha256
          } 2>&1 | tee -a /tmp/build.log

      - name: Live End-to-End 26.2 Smoke Test (Instant Boot + LAN Discovery 7551 + RakNet 19132 + Anti-Xray + Java Plugin & Menus)
        id: smoke_test
        run: |
          set -euo pipefail
          TEST_PLUGIN_JAR=$(find test-plugin/build/libs -maxdepth 1 -name "test-plugin-*.jar" | head -n 1)
          echo "Using compiled Java 26.2 plugin: $TEST_PLUGIN_JAR"
          mkdir -p /tmp/smoke-server/plugins
          cp purpurbedrock-26.2.jar /tmp/smoke-server/purpurbedrock-26.2.jar
          cp "$TEST_PLUGIN_JAR" /tmp/smoke-server/plugins/SmokeJavaPlugin.jar
          python3 - "$TEST_PLUGIN_JAR" << 'PY2'
          import sys, zipfile
          src = sys.argv[1]
          dst = "/tmp/smoke-server/plugins/SmokeApi263Plugin.jar"
          with zipfile.ZipFile(src, "r") as zin, zipfile.ZipFile(dst, "w") as zout:
              for item in zin.infolist():
                  if item.filename in ("paper-plugin.yml", "plugin.yml"):
                      continue
                  if item.filename.endswith("Compat263Plugin.class") or item.filename.startswith("META-INF/"):
                      zout.writestr(item, zin.read(item.filename))
              zout.writestr(
                  "plugin.yml",
                  "name: SmokeApi263Plugin\nversion: 1.0.0\nmain: org.purpurmc.testplugin.Compat263Plugin\napi-version: '26.3'\n",
              )
          PY2
          echo "eula=true" > /tmp/smoke-server/eula.txt
          cat > /tmp/smoke-server/server.properties << 'EOF'
          online-mode=false
          server-port=25565
          level-type=minecraft\:flat
          generate-structures=false
          spawn-protection=0
          max-players=20
          enforce-secure-profile=false
          EOF

          python3 -u - << 'PY'
          import os, pathlib, shutil, signal, socket, struct, subprocess, time

          def pack_varint(val):
              out = bytearray()
              while True:
                  b = val & 0x7F
                  val >>= 7
                  if val:
                      out.append(b | 0x80)
                  else:
                      out.append(b)
                      break
              return bytes(out)

          def read_varint(sock):
              val = 0
              shift = 0
              while True:
                  b = sock.recv(1)
                  if not b:
                      raise EOFError("Socket closed while reading varint")
                  byte = b[0]
                  val |= (byte & 0x7F) << shift
                  if not (byte & 0x80):
                      return val
                  shift += 7

          def pack_mc_str(s):
              raw = s.encode("utf-8")
              return pack_varint(len(raw)) + raw

          log_path = pathlib.Path("/tmp/server_out.log")
          out_f = log_path.open("w", encoding="utf-8")
          proc = subprocess.Popen(
              ["java", "-Xms1G", "-Xmx3G", "-jar", "purpurbedrock-26.2.jar", "--nogui"],
              cwd="/tmp/smoke-server",
              stdin=subprocess.PIPE,
              stdout=out_f,
              stderr=subprocess.STDOUT,
              text=True,
              close_fds=True,
              start_new_session=True,
          )
          try:
              print("Waiting for Purpurbedrock 26.2 server to finish booting...")
              booted = False
              for _ in range(150):
                  if proc.poll() is not None:
                      raise RuntimeError(f"Server exited early with code {proc.returncode}")
                  txt = log_path.read_text(encoding="utf-8", errors="replace")
                  if "Done (" in txt:
                      booted = True
                      break
                  time.sleep(1)
              if not booted:
                  raise RuntimeError("Timed out waiting for Purpurbedrock 26.2 boot!")

              proc.stdin.write("purpurbedrock status\npurpurbedrock antixray\n")
              proc.stdin.flush()
              time.sleep(3)

              # 1. Test Java Edition TCP Login Rejection on 127.0.0.1:25565
              with socket.create_connection(("127.0.0.1", 25565), timeout=5.0) as s:
                  hs_payload = pack_varint(0x00) + pack_varint(775) + pack_mc_str("127.0.0.1") + struct.pack(">H", 25565) + pack_varint(2)
                  hello_payload = pack_varint(0x00) + pack_mc_str("JavaTester") + (b"\x00" * 16)
                  s.sendall(pack_varint(len(hs_payload)) + hs_payload + pack_varint(len(hello_payload)) + hello_payload)

                  pkt_len = read_varint(s)
                  pkt = b""
                  while len(pkt) < pkt_len:
                      chunk = s.recv(pkt_len - len(pkt))
                      if not chunk:
                          break
                      pkt += chunk
                  assert pkt[0] == 0x00, f"Expected LoginDisconnect packet 0x00, got 0x{pkt[0]:02x}"
                  disconnect_text = pkt[1:].decode("utf-8", errors="replace")
                  print("JAVA_LOGIN_REJECT_OK:", disconnect_text)
                  assert "Bedrock" in disconnect_text or "Java" in disconnect_text

              # 2. Test Bedrock Edition UDP RakNet Unconnected Ping on 127.0.0.1:19132
              magic = bytes.fromhex("00ffff00fefefefefdfdfdfd12345678")
              ping = b"\x01" + struct.pack(">Q", int(time.time() * 1000)) + magic + struct.pack(">Q", 0x123456789ABCDEF0)
              usock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              usock.settimeout(4.0)
              pong_ok = False
              for _ in range(6):
                  usock.sendto(ping, ("127.0.0.1", 19132))
                  try:
                      data, _ = usock.recvfrom(4096)
                      if data and data[0] == 0x1C and b"MCPE;" in data:
                          idx = data.index(b"MCPE;")
                          print("BEDROCK_UDP_PONG_OK:", data[idx:].decode("utf-8", errors="replace"))
                          pong_ok = True
                          break
                  except socket.timeout:
                      time.sleep(1)
              usock.close()
              assert pong_ok, "Did not receive RakNet Unconnected Pong on UDP 19132!"

              # 3. Test NetherNet HTTP/WebSocket Signaling TCP listener on 127.0.0.1:19132
              with socket.create_connection(("127.0.0.1", 19132), timeout=5.0):
                  print("NETHERNET_TCP_SIGNALING_OK: connected to 127.0.0.1:19132")

              proc.stdin.write("stop\n")
              proc.stdin.flush()
              proc.stdin.close()
              try:
                  proc.wait(timeout=15)
                  print("CLEAN_SERVER_EXIT_OK:", proc.returncode)
              except subprocess.TimeoutExpired:
                  print("Forcing server exit after timeout")
          finally:
              try:
                  os.killpg(proc.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              out_f.close()

          server_log = log_path.read_text(encoding="utf-8", errors="replace")
          print("=== SERVER LOG TAIL ===")
          print("\n".join(server_log.splitlines()[-65:]))

          assert not pathlib.Path("/tmp/smoke-server/plugins/Geyser-Spigot").exists(), "plugins/Geyser-Spigot must NOT exist!"
          assert pathlib.Path("/tmp/smoke-server/bedrock.yml").is_file(), "bedrock.yml missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/custom_mappings").is_dir(), "bedrock/custom_mappings missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/extensions").is_dir(), "bedrock/extensions missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/packs").is_dir(), "bedrock/packs missing!"
          assert pathlib.Path("/tmp/smoke-server/unlock-windows-lan.bat").is_file(), "unlock-windows-lan.bat missing!"
          shutil.copyfile("/tmp/smoke-server/unlock-windows-lan.bat", "unlock-windows-lan.bat")

          required_lines = [
              "SMOKE_JAVA_PLUGIN_26_2_OK server=Purpurbedrock mc=26.2 invSize=27",
              "SMOKE_API_26_3_PLUGIN_OK",
              "загружен в режиме совместимости с 26.2",
              "Рабочие папки готовы: bedrock/custom_mappings | bedrock/extensions | bedrock/packs",
              "NetherNet LAN Discovery active on UDP",
              "Вход только с Bedrock (блок Java): ВКЛЮЧЁН",
              "Anti-Xray под Bedrock (Алмазы + Незерит): ВКЛЮЧЁН",
              "Защита от флагов движения и фантомных блоков: ВКЛЮЧЕНА",
              "Java-меню (DeluxeMenus / Chest GUI): ВКЛЮЧЕНЫ",
          ]
          for req in required_lines:
              assert req in server_log, f"Missing expected log line: {req!r}"

          print("ALL PURPURBEDROCK 26.2 LIVE SMOKE TESTS PASSED!")
          PY

      - name: Upload Purpurbedrock 26.2 Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: purpurbedrock-26.2
          path: |
            purpurbedrock-26.2.jar
            purpurbedrock-26.2.jar.sha256
            unlock-windows-lan.bat

      - name: Publish Purpurbedrock 26.2 Ready Core to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v26.2.0-bedrock
          name: "Purpurbedrock 26.2 — Чистое Bedrock-ядро с полной поддержкой Java-плагинов и меню"
          body: |
            ## Purpurbedrock `26.2` (`purpurbedrock-26.2.jar`)
            Автономное высокопроизводительное ядро на базе **Purpur `26.2` (`STABLE`)** — **100% независимое от внешнего GeyserMC**:
            - **Версия `26.2` (`26.2-R0.1-SNAPSHOT`)**: полная совместимость со всеми вашими Java-плагинами (`DeluxeMenus`, `packetevents 2.13.0`, `DecentHolograms`, `VoidItems`, `VoidTab`, `AuthMe`, `WorldEdit`, `WorldGuard`, `LuckPerms` и др.).
            - **Чистый Bedrock без внешних плагинов/сервисов**: встроенный протокольный движок внутри ядра (`RakNet UDP 19132` + `NetherNet WebRTC 19133` + **`NetherNet LAN Discovery UDP 7551`** для вкладки `Миры` на Bedrock `26.30–26.52`). Никаких скачиваний Mojang/GeyserMC при запуске — **мгновенный старт и мгновенный вход игроков**.
            - **Отдельная папка `bedrock/` в корне сервера**: ядро автоматически создаёт чистую структуру:
              - `bedrock/custom_mappings` (для `.json` маппингов предметов, стеклянных панелей, сфер и кастомных голов)
              - `bedrock/extensions` (для `.jar` расширений, таких как `GeyserJavaGlowing`, `VoidAnvilExtension` и др.)
              - `bedrock/packs` (для `.mcpack` / `.zip` ресурспаков Bedrock)
              *(при первом запуске автоматически переносит существующие файлы из старой папки `plugins/Geyser-Spigot/`, если она осталась в сборке).*
            - **Авто-совместимость карт и плагинов `26.3 -> 26.2`**: чанки, сохранённые на `26.3` (`DataVersion 5023`), автоматически адаптируются под `26.2` (`4903`) без остановки сервера, а плагины с `api-version: 26.3` (`WorldGuard 7.0.20` и др.) загружаются штатно.
            - **Полная поддержка Java-меню (`9x1`–`9x6`)**: нативный перехват кликов и переходов между подменю в `ServerGamePacketListenerImpl` + встроенная тестовая команда `/purpurbedrock menu` (`/pb menu`).
            - **Bedrock Anti-Xray (из коробки)**: `EngineMode.HIDE` (`Y <= 128`, `lava-obscures: true`) для Обычного мира (алмазы, изумруды, золото, железо, медь, лазурит, редстоун, уголь) и Незера (`ancient_debris`, кварц, незер-золото) с минимальной нагрузкой на FPS телефонов и TPS сервера.
            - **Ноль флагов движения и ноль фантомных блоков**: встроенные `BedrockMovementGuard` и `BedrockGhostBlockResync` (защита от откатов при спид-бриджинге, прыжках со слябов/лестниц, копании под Эффективностью V и отменах приватов `WorldGuard`).
            - **Нативная боёвка Bedrock (`1.8` / без КД)**: полный урон без кулдауна 1.9, криты в спринте, сохранение спринта в комбо, мгновенный щит + щит на шифте, откидывание снежками и яйцами.
            - **Видимость в локальной сети Windows 11**: при первом запуске автоматически создаётся `unlock-windows-lan.bat` (и прикреплён ниже) для снятия Windows UWP Loopback-блокировки одним кликом.
          files: |
            purpurbedrock-26.2.jar
            purpurbedrock-26.2.jar.sha256
            unlock-windows-lan.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Diagnostic Summary on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import os, subprocess
          log = ""
          if os.path.exists("/tmp/build.log"):
              with open("/tmp/build.log", "r", errors="replace") as f:
                  log = f.read()[-18000:]
          if os.path.exists("/tmp/server_out.log"):
              with open("/tmp/server_out.log", "r", errors="replace") as f:
                  log += "\n=== SERVER LOG ===\n" + f.read()[-8000:]
          body = f"### CI Build Failure Log (`{os.environ.get('GITHUB_SHA', '')[:7]}`)\n```\n{log}\n```"
          sha = os.environ["GITHUB_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=False,
          )
          PY
