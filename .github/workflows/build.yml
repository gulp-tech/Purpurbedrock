name: Build Purpurbedrock 26.2 Core
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "ver/**"
      - "arena/**"
      - "main"

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 & 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Configure Git identity for Paperweight
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"

      - name: Build Self-Contained Bedrock 26.2 Protocol Engine (Zero External Dependencies)
        id: build_bedrock_engine
        run: |
          set -euo pipefail
          {
            echo "=== Cloning Geyser 26.2 source (bbd7e67) for internal Purpurbedrock protocol engine ==="
            rm -rf /tmp/geyser-26.2
            git clone https://github.com/GeyserMC/Geyser.git /tmp/geyser-26.2
            git -C /tmp/geyser-26.2 checkout bbd7e67
            git -C /tmp/geyser-26.2 submodule update --init --recursive --depth 1

            echo "=== Applying Purpurbedrock 26.2 protocol engine patches ==="
            python3 "$GITHUB_WORKSPACE/scripts/patch-bedrock-engine.py" /tmp/geyser-26.2
            grep -Fq 'public synchronized void sendPostStartGamePackets()' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/session/UpstreamSession.java
            grep -Fq 'if (packets == null)' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/session/UpstreamSession.java
            grep -Fq 'postStartGamePackets = null;' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/session/UpstreamSession.java
            grep -Fq 'purpurbedrock.rakSessionTimeoutMs' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/network/RaknetServer.java
            grep -Fq 'Geyser.RakSendCookie", "true"' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/network/RaknetServer.java
            grep -Fq 'Geyser.MaxConnectionsPerAddress", 100' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/network/RaknetServer.java
            grep -Fq 'DefaultRakServerThrottle(maxConnectionsPerAddress, 1_000, 20)' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/network/RaknetServer.java
            grep -Fq 'CHUNK_SIZE = 1024 * 64' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/pack/GeyserResourcePack.java
            grep -Fq 'Confirm immediately. Real client RTT is measured independently' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/translator/protocol/java/JavaKeepAliveTranslator.java
            grep -Fq 'Math.max(300, config.pendingAuthenticationTimeout())' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/GeyserImpl.java
            grep -Fq 'replaceSessionsByXuid' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/session/SessionManager.java
            grep -Fq 'sessions.remove(uuid, session)' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/session/SessionManager.java
            grep -Fq 'Atomically evict that stale XUID' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/network/bedrock/UpstreamPacketHandler.java
            grep -Fq 'purpurbedrock.safeRemotePlayerSkins' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/skin/SkinManager.java
            grep -Fq 'PERFORMANCE_SAFE_SKINS_SENT' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/skin/SkinManager.java
            grep -Fq 'Never download, decode or resend a remote custom skin' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/skin/SkinManager.java
            grep -Fq 'entry.setXuid("")' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/skin/SkinManager.java
            grep -Fq 'Some servers repeat UPDATE_LISTED=true' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/translator/protocol/java/entity/player/JavaPlayerInfoUpdateTranslator.java
            grep -Fq 'Never move the publisher center to an out-of-range' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/util/ChunkUtils.java
            grep -Fq 'Keep this stable for the whole session' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/session/GeyserSession.java
            grep -Fq 'purpurbedrock.mobileCreativeItemLimit' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/session/GeyserSession.java
            grep -Fq 'loading-tip text disappears' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/util/ChunkUtils.java
            grep -Fq 'low-memory kill threshold' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/translator/protocol/java/level/JavaChunkBatchFinishedTranslator.java
            grep -Fq 'maxCachedCustomSkulls", 8' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/registry/populator/CustomSkullRegistryPopulator.java
            grep -Fq 'getDefaultPlayerSkin(new UUID(0L, 0L))' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/skin/SkinProvider.java
            grep -Fq 'determinePerformanceSafeSkinData' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/skin/SkinProvider.java
            grep -Fq 'register(Bedrock_v2225.CODEC, "26.60")' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/network/bedrock/GameProtocol.java
            grep -Fq 'ClientboundMatchmakingStatePacket.class' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/network/bedrock/CodecProcessor.java
            grep -Fq '.setPlayerCount(Math.max(1, pong.playerCount()))' /tmp/geyser-26.2/core/src/main/java/org/geysermc/geyser/network/bedrock/nethernet/NetherNetServer.java
            grep -Fq 'PURPURBEDROCK_LAN_V7 = true' /tmp/geyser-26.2/core/src/main/java/org/cloudburstmc/netty/channel/nethernet/signaling/NetherNetDiscovery.java
            grep -Fq 'static final int[] VERSIONS = {6, 7}' /tmp/geyser-26.2/core/src/main/java/org/cloudburstmc/netty/channel/nethernet/signaling/ServerData.java
            grep -Fq 'enum TransportDisconnectReason' /tmp/geyser-26.2/core/src/main/java/org/cloudburstmc/netty/channel/TransportDisconnectReason.java
            grep -Fq 'prefix: Purpurbedrock' /tmp/geyser-26.2/bootstrap/spigot/src/main/resources/plugin.yml
            test -s /tmp/geyser-26.2/core/src/main/resources/bedrock/block_palette.26_60.nbt
            test -s /tmp/geyser-26.2/core/src/main/resources/bedrock/runtime_item_states.26_60.json
            test -s /tmp/geyser-26.2/core/src/main/resources/bedrock/creative_items.26_60.json
            test -s /tmp/geyser-26.2/core/src/main/resources/bedrock/item_components.26_60.nbt
            test -s /tmp/geyser-26.2/core/src/main/resources/bedrock/data_driven_blocks.26_60.nbt
            echo "BEDROCK_26_60_V2225_SOURCE_OK POST_START_GAME_QUEUE_IDEMPOTENT_SOURCE_OK MOBILE_REMOTE_SKINS_SAFE_SOURCE_OK"

            echo "=== Bundling official 26.2 Russian/CIS/English system locales for 100% offline Bedrock translations ==="
            python3 "$GITHUB_WORKSPACE/scripts/bundle-bedrock-locales.py" /tmp/geyser-26.2

            echo "=== Compiling internal purpurbedrock-protocol.jar ==="
            # OpenCollab snapshot repository occasionally times out; preserve the Gradle cache and retry
            # instead of failing an otherwise deterministic release build on one transient GET.
            for attempt in 1 2 3; do
              if gradle -p /tmp/geyser-26.2 :spigot:shadowJar --no-daemon --stacktrace; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: Protocol engine build failed after 3 attempts"
                exit 1
              fi
              echo "OpenCollab dependency download failed (attempt $attempt/3); retrying in 20s..."
              sleep 20
            done

            PROTO_JAR=$(find /tmp/geyser-26.2/bootstrap/spigot/build/libs -maxdepth 1 -name "Geyser-Spigot*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
            if [ -z "$PROTO_JAR" ]; then
              echo "ERROR: Compiled protocol engine JAR not found!"
              exit 1
            fi
            mkdir -p "$GITHUB_WORKSPACE/purpur-server/src/main/resources/META-INF/bedrock"
            cp "$PROTO_JAR" "$GITHUB_WORKSPACE/purpur-server/src/main/resources/META-INF/bedrock/purpurbedrock-protocol.jar"
            ls -lh "$GITHUB_WORKSPACE/purpur-server/src/main/resources/META-INF/bedrock/purpurbedrock-protocol.jar"
          } 2>&1 | tee /tmp/build.log

      - name: Apply Purpurbedrock 26.2 Patches & Build Paperclip Server Core JAR
        id: gradle_build
        run: |
          set -euo pipefail
          {
            gradle applyAllPatches --stacktrace
            echo 'include(":test-plugin")' > test-plugin.settings.gradle.kts
            # Public Maven mirrors occasionally return a transient 502. Retry dependency
            # resolution without repeating patch application or hiding real compile failures.
            core_built=false
            for attempt in 1 2 3; do
              if gradle createPaperclipJar :purpur-api:publishToMavenLocal :test-plugin:jar --stacktrace; then
                core_built=true
                break
              fi
              echo "Core build attempt ${attempt}/3 failed; retrying dependency resolution..."
              sleep 20
            done
            if [ "$core_built" != true ]; then
              exit 1
            fi

            PURPUR_VER=$(ls -1 ~/.m2/repository/org/purpurmc/purpur/purpur-api | grep -v maven-metadata | head -n 1)
            echo "Building standalone PurpurBedrockAC against local maven purpur-api:${PURPUR_VER}..."
            gradle -p purpurbedrock-anticheat build -PpurpurVersion="${PURPUR_VER}" --no-daemon --stacktrace
            cp purpurbedrock-anticheat/build/libs/PurpurBedrockAC-26.2.jar PurpurBedrockAC-26.2.jar
            sha256sum PurpurBedrockAC-26.2.jar > PurpurBedrockAC-26.2.jar.sha256
            jar tf PurpurBedrockAC-26.2.jar | grep -q 'org/purpurmc/purpur/anticheat/engine/AntiEspManager.class'
            grep -q 'xray.engineMode = EngineMode.HIDE;' purpur-server/src/main/java/org/purpurmc/purpur/bedrock/BedrockAntiXrayHelper.java

            echo "Building standalone PurpurBedrockNPC against local maven purpur-api:${PURPUR_VER}..."
            gradle -p purpurbedrock-npc build -PpurpurVersion="${PURPUR_VER}" --no-daemon --stacktrace
            cp purpurbedrock-npc/build/libs/PurpurBedrockNPC-26.2.jar PurpurBedrockNPC-26.2.jar
            sha256sum PurpurBedrockNPC-26.2.jar > PurpurBedrockNPC-26.2.jar.sha256

            ls -la purpur-server/build/libs/
            PAPERCLIP_JAR=$(find purpur-server/build/libs -maxdepth 1 -name "*paperclip*.jar" | head -n 1)
            if [ -z "$PAPERCLIP_JAR" ]; then
              echo "No paperclip jar found!"
              exit 1
            fi
            cp "$PAPERCLIP_JAR" purpurbedrock-26.2.jar
            sha256sum purpurbedrock-26.2.jar > purpurbedrock-26.2.jar.sha256
            ls -lh purpurbedrock-26.2.jar purpurbedrock-26.2.jar.sha256 PurpurBedrockAC-26.2.jar PurpurBedrockAC-26.2.jar.sha256 PurpurBedrockNPC-26.2.jar PurpurBedrockNPC-26.2.jar.sha256
          } 2>&1 | tee -a /tmp/build.log

      - name: Live End-to-End 26.2 Smoke Test (Instant Boot + LAN Discovery 7551 + RakNet 19132 + Anti-Xray + Java Plugin & Menus)
        id: smoke_test
        run: |
          set -euo pipefail
          TEST_PLUGIN_JAR=$(find test-plugin/build/libs -maxdepth 1 -name "test-plugin-*.jar" | head -n 1)
          echo "Using compiled Java 26.2 plugin: $TEST_PLUGIN_JAR"
          mkdir -p /tmp/smoke-server/plugins
          cp purpurbedrock-26.2.jar /tmp/smoke-server/purpurbedrock-26.2.jar
          cp PurpurBedrockAC-26.2.jar /tmp/smoke-server/plugins/PurpurBedrockAC-26.2.jar
          cp PurpurBedrockNPC-26.2.jar /tmp/smoke-server/plugins/PurpurBedrockNPC-26.2.jar
          python3 - "$TEST_PLUGIN_JAR" << 'PY2'
          import os, struct, sys, zipfile, zlib
          src = sys.argv[1]
          smoke_main = "/tmp/smoke-server/plugins/SmokeJavaPlugin.jar"
          dst = "/tmp/smoke-server/plugins/SmokeApi263Plugin.jar"
          papi_dst = "/tmp/smoke-server/plugins/PlaceholderAPI.jar"
          with zipfile.ZipFile(src, "r") as zin:
              with zipfile.ZipFile(smoke_main, "w") as zmain:
                  for item in zin.infolist():
                      if item.filename.startswith("me/clip/") or item.filename.endswith("Compat263Plugin.class"):
                          continue
                      zmain.writestr(item, zin.read(item.filename))
              with zipfile.ZipFile(dst, "w") as zout:
                  for item in zin.infolist():
                      if item.filename in ("paper-plugin.yml", "plugin.yml"):
                          continue
                      if item.filename.endswith("Compat263Plugin.class") or item.filename.startswith("META-INF/"):
                          zout.writestr(item, zin.read(item.filename))
                  zout.writestr(
                      "plugin.yml",
                      "name: SmokeApi263Plugin\nversion: 1.0.0\nmain: org.purpurmc.testplugin.Compat263Plugin\napi-version: '26.3'\n",
                  )
              with zipfile.ZipFile(papi_dst, "w") as zpapi:
                  for item in zin.infolist():
                      if item.filename.startswith("me/clip/") or item.filename.startswith("META-INF/"):
                          zpapi.writestr(item, zin.read(item.filename))
                  zpapi.writestr(
                      "plugin.yml",
                      "name: PlaceholderAPI\nversion: 2.11.6\nmain: me.clip.placeholderapi.PlaceholderAPIPlugin\napi-version: '26.2'\n",
                  )

          # Seed a genuine 48x16 HeadDatabase skull PNG in bedrock/cache/player_skulls/
          skulls_dir = "/tmp/smoke-server/bedrock/cache/player_skulls"
          os.makedirs(skulls_dir, exist_ok=True)
          def png_chunk(ctype, data):
              return struct.pack(">I", len(data)) + ctype + data + struct.pack(">I", zlib.crc32(ctype + data) & 0xFFFFFFFF)
          w, h = 48, 16
          raw = b"".join(b"\x00" + (b"\x44\x88\xcc\xff" * w) for _ in range(h))
          png_bytes = (
              b"\x89PNG\r\n\x1a\n"
              + png_chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
              + png_chunk(b"IDAT", zlib.compress(raw))
              + png_chunk(b"IEND", b"")
          )
          with open(f"{skulls_dir}/00bd5ef1e38f8656df9bc04f87867963fb1479678fcad4eb89a452256fc4bd80.png", "wb") as pf:
              pf.write(png_bytes)
          PY2
          echo "eula=true" > /tmp/smoke-server/eula.txt
          cat > /tmp/smoke-server/server.properties << 'EOF'
          online-mode=false
          server-port=25565
          level-type=minecraft\:flat
          generate-structures=false
          spawn-protection=0
          max-players=20
          enforce-secure-profile=false
          EOF

          python3 -u - << 'PY'
          import os, pathlib, shutil, signal, socket, struct, subprocess, time

          def pack_varint(val):
              out = bytearray()
              while True:
                  b = val & 0x7F
                  val >>= 7
                  if val:
                      out.append(b | 0x80)
                  else:
                      out.append(b)
                      break
              return bytes(out)

          def read_varint(sock):
              val = 0
              shift = 0
              while True:
                  b = sock.recv(1)
                  if not b:
                      raise EOFError("Socket closed while reading varint")
                  byte = b[0]
                  val |= (byte & 0x7F) << shift
                  if not (byte & 0x80):
                      return val
                  shift += 7

          def pack_mc_str(s):
              raw = s.encode("utf-8")
              return pack_varint(len(raw)) + raw

          log_path = pathlib.Path("/tmp/server_out.log")
          out_f = log_path.open("w", encoding="utf-8")
          proc = subprocess.Popen(
              ["java", "-Xms1G", "-Xmx3G", "-jar", "purpurbedrock-26.2.jar", "--nogui"],
              cwd="/tmp/smoke-server",
              stdin=subprocess.PIPE,
              stdout=out_f,
              stderr=subprocess.STDOUT,
              text=True,
              close_fds=True,
              start_new_session=True,
          )
          try:
              print("Waiting for Purpurbedrock 26.2 server to finish booting...")
              booted = False
              for _ in range(150):
                  if proc.poll() is not None:
                      raise RuntimeError(f"Server exited early with code {proc.returncode}")
                  txt = log_path.read_text(encoding="utf-8", errors="replace")
                  if "Done (" in txt:
                      booted = True
                      break
                  time.sleep(1)
              if not booted:
                  raise RuntimeError("Timed out waiting for Purpurbedrock 26.2 boot!")

              proc.stdin.write("purpurbedrock status\npurpurbedrock skulls off\npurpurbedrock skulls status\npurpurbedrock skulls on\npurpurbedrock antixray\npurpurbedrock papi\npurpurbedrock selftest\npac status\npac checks\npac selftest\npbnpc selftest\n")
              proc.stdin.flush()
              time.sleep(3)

              # 1. Test Java Edition TCP Login Rejection on 127.0.0.1:25565
              with socket.create_connection(("127.0.0.1", 25565), timeout=5.0) as s:
                  hs_payload = pack_varint(0x00) + pack_varint(775) + pack_mc_str("127.0.0.1") + struct.pack(">H", 25565) + pack_varint(2)
                  hello_payload = pack_varint(0x00) + pack_mc_str("JavaTester") + (b"\x00" * 16)
                  s.sendall(pack_varint(len(hs_payload)) + hs_payload + pack_varint(len(hello_payload)) + hello_payload)

                  pkt_len = read_varint(s)
                  pkt = b""
                  while len(pkt) < pkt_len:
                      chunk = s.recv(pkt_len - len(pkt))
                      if not chunk:
                          break
                      pkt += chunk
                  assert pkt[0] == 0x00, f"Expected LoginDisconnect packet 0x00, got 0x{pkt[0]:02x}"
                  disconnect_text = pkt[1:].decode("utf-8", errors="replace")
                  print("JAVA_LOGIN_REJECT_OK:", disconnect_text)
                  assert "Bedrock" in disconnect_text or "Java" in disconnect_text

              # 2. Test Bedrock Edition UDP RakNet Unconnected Ping on 127.0.0.1:19132
              magic = bytes.fromhex("00ffff00fefefefefdfdfdfd12345678")
              ping = b"\x01" + struct.pack(">Q", int(time.time() * 1000)) + magic + struct.pack(">Q", 0x123456789ABCDEF0)
              usock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              usock.settimeout(4.0)
              pong_ok = False
              for _ in range(6):
                  usock.sendto(ping, ("127.0.0.1", 19132))
                  try:
                      data, _ = usock.recvfrom(4096)
                      if data and data[0] == 0x1C and b"MCPE;" in data:
                          idx = data.index(b"MCPE;")
                          print("BEDROCK_UDP_PONG_OK:", data[idx:].decode("utf-8", errors="replace"))
                          pong_ok = True
                          break
                  except socket.timeout:
                      time.sleep(1)
              usock.close()
              assert pong_ok, "Did not receive RakNet Unconnected Pong on UDP 19132!"

              # 3. Test NetherNet HTTP/WebSocket Signaling TCP listener on 127.0.0.1:19132
              with socket.create_connection(("127.0.0.1", 19132), timeout=5.0):
                  print("NETHERNET_TCP_SIGNALING_OK: connected to 127.0.0.1:19132")

              proc.stdin.write("stop\n")
              proc.stdin.flush()
              proc.stdin.close()
              try:
                  proc.wait(timeout=15)
                  print("CLEAN_SERVER_EXIT_OK:", proc.returncode)
              except subprocess.TimeoutExpired:
                  print("Forcing server exit after timeout")
          finally:
              try:
                  os.killpg(proc.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              out_f.close()

          server_log = log_path.read_text(encoding="utf-8", errors="replace")
          print("=== SERVER LOG TAIL ===")
          print("\n".join(server_log.splitlines()[-65:]))

          assert not pathlib.Path("/tmp/smoke-server/plugins/Geyser-Spigot").exists(), "plugins/Geyser-Spigot must NOT exist!"
          assert pathlib.Path("/tmp/smoke-server/bedrock.yml").is_file(), "bedrock.yml missing!"
          assert not pathlib.Path("/tmp/smoke-server/bedrock/config.yml").exists(), "internal config.yml must NOT pollute bedrock/!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/cache").is_dir(), "bedrock/cache missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/cache/player_skulls").is_dir(), "bedrock/cache/player_skulls missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/cache/player_skulls/00bd5ef1e38f8656df9bc04f87867963fb1479678fcad4eb89a452256fc4bd80.png").is_file(), "HeadDatabase skull PNG was deleted!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/cache/player_skulls.mcpack").is_file(), "bedrock/cache/player_skulls.mcpack missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/cache/GeyserIntegratedPack.mcpack").is_file(), "bedrock/cache/GeyserIntegratedPack.mcpack missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/cache/images").is_dir(), "bedrock/cache/images missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/cache/default_player_skins").is_dir(), "bedrock/cache/default_player_skins missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/cache/remote_packs").is_dir(), "bedrock/cache/remote_packs missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/custom_mappings").is_dir(), "bedrock/custom_mappings missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/extensions").is_dir(), "bedrock/extensions missing!"
          assert pathlib.Path("/tmp/smoke-server/bedrock/packs").is_dir(), "bedrock/packs missing!"
          lan_helper = pathlib.Path("/tmp/smoke-server/unlock-windows-lan.bat")
          assert lan_helper.is_file(), "unlock-windows-lan.bat missing!"
          lan_helper_text = lan_helper.read_text(encoding="utf-8")
          assert "Get-AppxPackage '*Minecraft*'" in lan_helper_text, "LAN helper missing dynamic Minecraft package exemption!"
          assert 'dir=out action=allow protocol=UDP localport=7551,19132-19134' in lan_helper_text, "LAN helper missing outbound discovery firewall rule!"
          shutil.copyfile(lan_helper, "unlock-windows-lan.bat")

          assert "Recoverable errors when loading section" not in server_log, "Unexpected chunk section palette error!"
          assert "Failed to create block entity" not in server_log, "Unexpected block entity error!"
          assert "[sun.instrument.InstrumentationImpl]" not in server_log, "Unexpected sun.instrument STDERR warning!"

          required_lines = [
              "SMOKE_JAVA_PLUGIN_26_2_OK server=Purpurbedrock mc=26.2 invSize=27",
              "SMOKE_API_26_3_PLUGIN_OK",
              "загружен в режиме совместимости с 26.2",
              "Рабочие папки готовы: bedrock/cache (player_skulls / HeadDatabase) | bedrock/custom_mappings | bedrock/extensions | bedrock/packs",
              "Registered 1 custom skulls as custom blocks.",
