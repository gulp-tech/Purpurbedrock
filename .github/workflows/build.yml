            - **Встроенные системные локали `26.2` (`ru_ru`, `uk_ua`, `be_by`, `kk_kz`, `en_us`, `deprecated` + `REPLACED_KEYS`)**:
              - Все ванильные ключи (`block.minecraft.spawn.not_valid`, вход/выход игроков, смерти, команды, кровати/якоря возрождения) переводятся в текст автоматически прямо из `purpurbedrock-26.2.jar` без докачки с серверов Mojang.
            - **Умный анализатор 6 устройств Bedrock + КМ с телефона (`%purpurbedrock_device%`, `%purpurbedrock_device_id%`, `%purpurbedrock_is_phone_kbm%`)**:
              - Точно определяет **`Windows`**, **`Android`**, **`IOS`**, **`Xbox`**, **`PS 4-5`** и **`Клавиатура + мышь`** (OTG/Bluetooth клавиатура и мышь, подключённые к телефону Android/iOS, в реальном времени `20 Гц` + защита от спуфа Touch и спуфа Android с ПК).
            - **Фикс зависаний и ошибок `sessionserver.mojang.com` (`Read timed out`)**:
              - В `PaperMinecraftSessionService` отключены бесполезные запросы к `sessionserver.mojang.com` для оффлайн/Bedrock UUID и серверов с `online-mode: false` (`SkinsRestorer` и `HeadDatabase` продолжают работать штатно).
            - **Новый сверхлёгкий плагин NPC `PurpurBedrockNPC-26.2.jar`**:
              - Неподвижные обычные мобы без AI, awareness, гравитации, коллизии, звука, урона и лута; плагин создаёт `0` периодических задач. Многострочная редактируемая голограмма использует одну `TextDisplay`, а клики запускают редактируемые console/player-команды, сообщения, DeluxeMenus или телепорт.
            - **Отдельный плагин-античит `PurpurBedrockAC-26.2.jar` (папка `purpurbedrock-anticheat/`, не мешает ядру)**:
              - **Адаптивный спящий режим (`DORMANT → SLEEPING → WAKING → AWAKE`)**: в тишине спит (`0% CPU`), при первых аномалиях плавно и не спеша просыпается только для подозрительного игрока, не нагружая сервер.
              - **Совместимость с кастомным буром 3×3 / 3×3×2**: синтетические соседние `BlockBreakEvent` без соответствующего клиентского `BlockDamageEvent` больше не считаются `Nuker` или `FastBreak`; реальная пакетная добыча читом продолжает проверяться.
              - **Anti-False-Alert v2**: одиночные скачки Geyser, мобильного FPS и Wi-Fi больше не попадают в жалобы/историю/VL — требуется 2 разнесённых во времени подтверждения, 3 при высоком пинге; повтор одного модуля ограничен раз в 4 секунды. Невозможные `BadPackets` блокируются сразу.
              - **25 проверок с защитой от ложных флагов на Bedrock** (учитывает Сенсор / ПК / Геймпад, спид-бриджинг и реальный RTT пинг): `Reach` (3D AABB + компенсация пинга), `HitBox`, `KillAura`, `Aim`, `AutoClicker`, `Criticals`, `Velocity`, `AutoTotem`, `FastBow`, `Fly`, `ElytraFly`, `AirJump`, `Speed/BHop`, `Step`, `HighJump`, `Spider`, `Jesus`, `NoSlow`, `NoFall`, `Phase`, `Timer`, `Scaffold`, `FastBreak`, `Inventory`, `BadPackets`.
              - **Device-Adaptive Rendering (`SAFE / BALANCED / HIGH`)**: по ОС, типу ввода и реальному RTT автоматически ограничивает радиус чанков, темп chunk batch, повторные login-refresh и AVG-голограммы; при просадке TPS дополнительно снижает частоту обновлений без кика игрока.
              - **Небольшая голограмма `AVG` (`/pac holo`)**: Android/iOS/телефон+КМ — до 8 целей, 16 блоков, 4 Гц; консоли — 12/24/≈7 Гц; Windows — 20/32/10 Гц. Видна только модераторам, а без зрителей создаёт 0 сущностей и 0 задач.
              - **Меню истории игрока в стиле HolyWorld (`/pac menu`, `/pac history <ник>`, право `purpurac.menu`)**: `54` слота с **зелёными 🟢 / оранжевыми 🟠 / красными 🔴** блоками истории и **блоками-инструкциями внизу меню**.
            - **Исправлена погрузка чанков на Bedrock (Moonrise + `NetworkChunkPublisherUpdatePacket` Sync)**:
              - Гарантированная синхронизация `NetworkChunkPublisherUpdatePacket` при входе, стоянии на месте, полёте, любых телепортациях (`/tp`, `/spawn`, `/warp`, `/rtp`, `AuthMe`), смене измерений и изменении ползунка дальности прорисовки на клиенте (`ensureChunkPublished` никогда не даёт клиенту Bedrock отбросить пришедший `LevelChunkPacket`).
              - Убран баг начального радиуса `2` чанка на стадии `CONFIGURATION`, отключено занижение радиуса Moonrise (`auto-config-send-distance: false`), увеличены лимиты стриминга чанков (`120 send/s`, `200 load/s`, `8 concurrent`, `batch=32`) + добавлена команда принудительного ресинка `/pb chunks [игрок]`.
            - **Встроенные PlaceholderAPI-плейсхолдеры прямо из ядра (`%purpurbedrock_*%`)** без лишних плагинов (авто-регистрация в `PlaceholderAPI` с `persist = true` для `VoidTab`, скорбордов и `DeluxeMenus`):
              - `%purpurbedrock_device%` — `📱 Телефон`, `🖥 ПК`, `🎮 Геймпад`, `PlayStation`, `Xbox`, `Switch`
              - `%purpurbedrock_input%` — `Сенсор`, `Клавиатура+Мышь`, `Контроллер` (обновляется в реальном времени)
              - `%purpurbedrock_version%` — точная версия клиента Bedrock игрока (например, `1.21.50` или `26.60`)
              - `%purpurbedrock_ping%` — реальный RakNet / NetherNet WebRTC RTT пинг в мс (также пробрасывается в `Player#getPing()`)
              - Дополнительно: `%purpurbedrock_ping_colored%`, `%purpurbedrock_os%`, `%purpurbedrock_protocol%`, `%purpurbedrock_ui%`, `%purpurbedrock_xuid%`, `%purpurbedrock_is_bedrock%`.
            - **Исправлено отображение сервера в локальной сети Bedrock 26.60**: сервер отвечает правильными форматами LAN-анонса `v6` и `v7` вместо устаревшего `v4`, а пустой сервер больше не скрывается клиентом; обновлённый `unlock-windows-lan.bat` автоматически находит все установленные пакеты Minecraft и открывает входящий/исходящий UDP `7551`, `19132–19134`.
            - **Исправлено отключение Bedrock-сессии без предупреждений и stack trace**: добавлена совместимость `TransportDisconnectReason`, а консольный префикс встроенного протокола заменён на `Purpurbedrock`.
            - **NPC теперь гарантированно создаётся перед игроком**: повторный `/pbnpc create` с занятым ID пересоздаёт существующего NPC перед игроком вместо отказа; команда сообщает успех только после реального появления моба и голограммы, загружает нужный чанк и сразу восстанавливает их видимость ближайшим игрокам.
            - **NPC полностью невосприимчивы к эффектам**: зелья, стрелы с эффектами, маяки, команды и плагины не могут наложить или усилить эффект на NPC; старые эффекты очищаются при создании.
            - **Убраны зависания слабых телефонов при прогрузке игроков**: Android/iOS/консоли используют одну общую встроенную текстуру 64×64 без удалённого XUID-поиска; ядро не скачивает полные скины и отбрасывает повторные обновления списка при телепортах/респавнах. Собственный скин и полные скины на Windows не изменены.
            - **Убрано моргание чанков**: радиус публикации больше не скачет вслед за колебаниями пинга, центр не переносится к дальним устаревшим чанкам и не отправляется повторно через 500 мс после входа. Ограничение скорости чанков по RTT сохранено.
            - **Исправлен вылет части телефонов сразу после загрузочной подсказки «Выжить»**: начальная область уменьшена без пустых/мигающих чанков, поток чанков для телефонов и неизвестных Android-клиентов ограничен до безопасных 6/с, тяжёлый творческий каталог ограничен 512 записями, а статические кастомные головы — 8 текстурами. Windows не ограничен.
            - **Убраны кики «Превышено время ожидания» при входе**: сетевой сеанс терпит до 120 секунд временной потери связи вместо 10, Java keepalive подтверждается независимо от зависшего экрана загрузки, паки передаются устойчивыми блоками 64 КиБ вместо 256 КиБ, а окно авторизации увеличено до 300 секунд. Реальный RTT продолжает измеряться отдельно.
            - **Исправлен повторный вход после вылета/тайм-аута**: новое подключение по тому же XUID атомарно заменяет зависшую старую или незавершённую сессию; позднее закрытие старого соединения больше не может удалить новую сессию. Перезапуск сервера между первой и второй попыткой не требуется.
            - **Исправлен сетевой блок второй попытки ещё до авторизации**: снова включена безопасная cookie-проверка владения UDP-адресом, поэтому новый handshake немедленно закрывает старый транспортный канал вместо ожидания 120 секунд; допустимо 20 быстрых повторов в секунду и до 100 соединений за одним CGNAT-адресом.
            - **Полная мульти-версия Bedrock от `1.21.0` до `26.60` (`v685` — `v2225`, все 24 кодека протокола)**: игроки могут бесшовно заходить с любых версий `1.21.x` (`1.21.0`, `1.21.20`, `1.21.30`, `1.21.40`, `1.21.50`, `1.21.60`, `1.21.70`, `1.21.80`, `1.21.90–94`, `1.21.100`, `1.21.110`, `1.21.120–124`, `1.21.130–132`) и `26.x` (`26.0–26.3`, `26.10–26.12`, `26.20–26.23`, `26.30–26.34`, `26.40–26.45`, `26.50–26.52`, `26.60`) без вылетов, киков и ошибок пакетов/палитр.
            - **Убрано навязчивое окно диалога `gui.waitingForResponse.title`** («Идёт ожидание нового диалога от сервера...»): переходы и закрытие Java Dialog-меню происходят мгновенно без промежуточного экрана ожидания.
            - **Исправлена ошибка консоли `[STDERR] [sun.instrument.InstrumentationImpl] WARNING: A Java agent has been loaded dynamically`**: встроенный фильтр в `SysoutCatcher` полностью убирает ложный `[ERROR]: [STDERR]` от ByteBuddy/плагинов на Java 25 (дополнительно можно добавить `-XX:+EnableDynamicAgentLoading` в `.bat`/`.sh`).
            - **Версия сервера `26.2` (`26.2-R0.1-SNAPSHOT`)**: полная совместимость со всеми вашими Java-плагинами (`DeluxeMenus`, `packetevents 2.13.0`, `DecentHolograms`, `LMtops`, `HeadDatabase`, `VoidItems`, `VoidTab`, `AuthMe`, `WorldEdit`, `WorldGuard`, `LuckPerms` и др.).
            - **Чистый Bedrock без внешних плагинов/сервисов**: встроенный протокольный движок внутри ядра (`RakNet UDP 19132` + `NetherNet WebRTC 19133` + **`NetherNet LAN Discovery UDP 7551`** для вкладки `Миры` на Bedrock `26.30–26.60`). Никаких скачиваний Mojang/GeyserMC при запуске — **мгновенный старт и мгновенный вход игроков**.
            - **Отдельная папка `bedrock/` в корне сервера**:
              - `bedrock/cache` — кэш Bedrock: **`bedrock/cache/player_skulls`** (автоматическое подключение кастомных 3D-голов плагина **`HeadDatabase`** + сборка `player_skulls.mcpack` и `GeyserIntegratedPack.mcpack`), `images`, `default_player_skins`, `remote_packs`
              - `bedrock/custom_mappings` (`.json` маппинги предметов, стеклянных панелей, сфер и кастомных голов)
              - `bedrock/extensions` (`.jar` расширения: `GeyserJavaGlowing`, `VoidAnvilExtension` и др.)
              - `bedrock/packs` (`.mcpack` / `.zip` ресурспаки Bedrock)
            - **Полная обратная совместимость карт и плагинов `26.3 -> 26.2`**: бесшовная конвертация палитр блоков, тайлов, предметов (`golden_dandelion`, `sulfur_cube` и др.), `blending_data` и `DataVersion 5023 -> 4903` без сброса блоков в `air` и без ошибок `Invalid block entity`, а плагины с `api-version: 26.3` (`WorldGuard 7.0.20` и др.) загружаются штатно.
            - **Полная поддержка Java-меню (`9x1`–`9x6`)**: нативный перехват кликов и переходов между подменю в `ServerGamePacketListenerImpl` + встроенная команда `/purpurbedrock menu` (`/pb menu`).
            - **Bedrock Anti-Xray (из коробки)**: `EngineMode.HIDE` (`Y <= 128`, `lava-obscures: true`) для Обычного мира и Незера с минимальной нагрузкой на FPS телефонов и TPS сервера.
