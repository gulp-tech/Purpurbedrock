          body: |
            ## Purpurbedrock `26.2` FINAL (`purpurbedrock-26.2.jar`) + Отдельный античит `PurpurBedrockAC-26.2.jar` (`v26.2.6`)
            Финальное автономное высокопроизводительное ядро на базе **Purpur `26.2` (`STABLE`)** и отдельный адаптивный античит, откалиброванный специально под него:
            - **Исправлено 20-секундное зависание телефона при появлении другого игрока**: Android/iOS/консоли получают для других игроков лёгкий ванильный скин `64×64` без тяжёлой persona-геометрии и плащей. Собственный скин игрока не меняется, а Windows продолжает видеть полные скины.
