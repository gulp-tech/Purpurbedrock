      - name: Post Diagnostic Summary on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import os, subprocess
          log = ""
          if os.path.exists("/tmp/build.log"):
              with open("/tmp/build.log", "r", errors="replace") as f:
                  full = f.read()
              lines = full.splitlines()
              errs = []
              for idx, ln in enumerate(lines):
                  if ": error:" in ln or "Exception:" in ln or "Error:" in ln:
                      errs.extend(lines[max(0, idx - 1):min(len(lines), idx + 6)])
                      errs.append("---")
              err_summary = "\n".join(errs[:200])
              log = ("=== ERRORS ===\n" + err_summary + "\n=== TAIL ===\n" if err_summary else "") + full[-12000:]
          if os.path.exists("/tmp/server_out.log"):
              with open("/tmp/server_out.log", "r", errors="replace") as f:
                  log += "\n=== SERVER LOG ===\n" + f.read()[-8000:]
          body = f"### CI Build Failure Log (`{os.environ.get('GITHUB_SHA', '')[:7]}`)\n```\n{log}\n```"
          sha = os.environ["GITHUB_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          subprocess.run(
              ["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"],
              check=False,
          )
          PY
