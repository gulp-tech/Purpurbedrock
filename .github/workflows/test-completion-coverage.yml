name: Investigate Bedrock completion coverage
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/test-completion-coverage.yml', 'scripts/tests/completion-coverage/**']
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful core build run ID to test"
        required: true
      head_sha:
        description: "Expected commit SHA of the core build"
        required: true
permissions:
  actions: read
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build isolated test fixture
        run: gradle -p scripts/tests/completion-coverage clean jar --no-daemon --stacktrace
      - name: Install test client
        run: npm ci --no-audit --no-fund
        working-directory: scripts/tests/completion-coverage
      - name: Verify selected build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id || '43617740404' }}
          EXPECTED_SHA: ${{ inputs.head_sha || 'b4a0a9229fa3855b10ba227dc878d72f81f15d11' }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$EXPECTED_SHA"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowDatabaseId --jq .workflowDatabaseId)" = "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml" --jq .id)"
          echo "Validated core build $RUN_ID at $EXPECTED_SHA"
      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: purpurbedrock-26.2
          path: /tmp/coverage-artifacts
          repository: gulp-tech/Purpurbedrock
          run-id: ${{ inputs.run_id || '43617740404' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare plugin, typed and vanilla command coverage
        run: |
          set -euo pipefail
          (cd /tmp/coverage-artifacts && sha256sum -c purpurbedrock-26.2.jar.sha256)
          mkdir -p /tmp/coverage-server/plugins/PurpurBedrockCompletions
          # Exercise existing installations with the original persisted default capacities.
          cat > /tmp/coverage-server/plugins/PurpurBedrockCompletions/config.yml <<'CONFIG'
          max-commands-per-player: 128
          max-total-nodes-per-player: 128
          max-total-candidates-per-player: 1024
          CONFIG
          cat > /tmp/coverage-server/bedrock.yml <<'CONFIG'
          gameplay:
            max-client-commands: 96
            command-suggestions: true
            dynamic-command-completions: true
          config-schema: 6
          CONFIG
          cp /tmp/coverage-artifacts/purpurbedrock-26.2.jar /tmp/coverage-server/server.jar
          cp scripts/tests/completion-coverage/build/libs/completion-coverage-fixture.jar /tmp/coverage-server/plugins/fixture.jar
          echo 'eula=true' > /tmp/coverage-server/eula.txt
          cat > /tmp/coverage-server/server.properties <<'PROPS'
          online-mode=false
          server-port=25565
          level-type=minecraft\:flat
          generate-structures=false
          difficulty=peaceful
          spawn-protection=0
          enforce-secure-profile=false
          PROPS
          python3 -u - <<'PY'
          import os, pathlib, signal, subprocess, time
          directory = pathlib.Path('/tmp/coverage-server')
          output = open('/tmp/coverage-server.log', 'w', encoding='utf-8')
          server = subprocess.Popen(['java', '-Xms1G', '-Xmx3G', '-jar', 'server.jar', '--nogui'], cwd=directory, stdin=subprocess.PIPE, stdout=output, stderr=subprocess.STDOUT, text=True, start_new_session=True)
          try:
              for i in range(600):
                  if server.poll() is not None: raise RuntimeError('Server stopped before startup')
                  if 'Done (' in pathlib.Path('/tmp/coverage-server.log').read_text(errors='replace'): break
                  time.sleep(1)
              else: raise RuntimeError('Timed out waiting for server')
              testdir = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'scripts/tests/completion-coverage'
              subprocess.run(['node', 'coverage.cjs'], cwd=testdir, check=True, timeout=240)
              server.stdin.write('stop\n'); server.stdin.flush(); server.wait(timeout=30)
          finally:
              try: os.killpg(server.pid, signal.SIGKILL)
              except ProcessLookupError: pass
              output.close()
              for line in pathlib.Path('/tmp/coverage-server.log').read_text(errors='replace').splitlines():
                  if 'COVERAGE_COMMAND_MAP ' in line:
                      print('::notice title=Command registry::' + line.split('COVERAGE_COMMAND_MAP ', 1)[1])
              print('\n'.join(pathlib.Path('/tmp/coverage-server.log').read_text(errors='replace').splitlines()[-30:]))
          PY
      - name: Upload investigation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completion-coverage-logs
          path: /tmp/coverage-server.log
          if-no-files-found: ignore
      - name: Record tested build
        env:
          RUN_ID: ${{ inputs.run_id || '43617740404' }}
          SHA: ${{ inputs.head_sha || 'b4a0a9229fa3855b10ba227dc878d72f81f15d11' }}
        run: printf '%s\n%s\n' "$RUN_ID" "$SHA" > tested-core.txt
      - uses: actions/upload-artifact@v4
        with:
          name: completion-tested-core
          path: tested-core.txt
          if-no-files-found: error
