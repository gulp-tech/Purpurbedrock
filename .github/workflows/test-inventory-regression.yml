name: Investigate player inventory close and reopen
on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/test-inventory-regression.yml'
      - 'purpurbedrock-completions/tests/bedrock/inventory-regression.cjs'
      - 'purpurbedrock-completions/tests/bedrock/item-integrity.cjs'
      - 'purpurbedrock-completions/tests/bedrock/drop-integrity.cjs'
      - 'scripts/tests/inventory-fixture/**'
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful core build run ID
        required: true
      head_sha:
        description: Expected commit SHA of core build
        required: true
permissions:
  actions: read
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build disposable inventory fixture
        run: gradle -p scripts/tests/inventory-fixture clean jar --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test client
        run: npm ci --no-audit --no-fund
        working-directory: purpurbedrock-completions/tests/bedrock
      - name: Verify tested build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id || '43067647804' }}
          EXPECTED_SHA: ${{ inputs.head_sha || '1e6a6a207a65ab9ab83faaf693d8c8af64274422' }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$EXPECTED_SHA"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowDatabaseId --jq .workflowDatabaseId)" = "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml" --jq .id)"
      - uses: actions/download-artifact@v4
        with:
          name: purpurbedrock-26.2
          path: /tmp/inventory-artifacts
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || '43067647804' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run isolated player-inventory packet test
        run: |
          set -euo pipefail
          (cd /tmp/inventory-artifacts && sha256sum -c purpurbedrock-26.2.jar.sha256)
          mkdir -p /tmp/inventory-server/plugins
          cp scripts/tests/inventory-fixture/build/libs/inventory-fixture.jar /tmp/inventory-server/plugins/fixture.jar
          cp /tmp/inventory-artifacts/purpurbedrock-26.2.jar /tmp/inventory-server/server.jar
          echo 'eula=true' > /tmp/inventory-server/eula.txt
          # This is a disposable offline test world; the test user alone is an operator.
          echo '[{"uuid":"6cb11aa2-eca9-3ad2-a912-69f09d49d6e6","name":"InvTest","level":4,"bypassesPlayerLimit":false}]' > /tmp/inventory-server/ops.json
          cat > /tmp/inventory-server/server.properties <<'PROPS'
          online-mode=false
          server-port=25565
          level-type=minecraft\:flat
          generate-structures=false
          difficulty=peaceful
          spawn-protection=0
          enforce-secure-profile=false
          PROPS
          python3 -u - <<'PY'
          import os, pathlib, signal, subprocess, time
          directory = pathlib.Path('/tmp/inventory-server')
          output = open('/tmp/inventory-server.log', 'w', encoding='utf-8')
          server = subprocess.Popen(['java', '-Xms1G', '-Xmx3G', '-jar', 'server.jar', '--nogui'], cwd=directory, stdin=subprocess.PIPE, stdout=output, stderr=subprocess.STDOUT, text=True, start_new_session=True)
          try:
              for _ in range(600):
                  if server.poll() is not None: raise RuntimeError('Server stopped before startup')
                  if 'Done (' in pathlib.Path('/tmp/inventory-server.log').read_text(errors='replace'): break
                  time.sleep(1)
              else: raise RuntimeError('Timed out waiting for server')
              testdir = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'purpurbedrock-completions/tests/bedrock'
              result = subprocess.run(['node', 'inventory-regression.cjs'], cwd=testdir, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=120)
              print(result.stdout, flush=True)
              # Also surface a concise result as an annotation when the runner's log storage is inaccessible.
              report = result.stdout[-2500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Inventory packet test::' + report, flush=True)
              result.check_returncode()
              result = subprocess.run(['node', 'item-integrity.cjs'], cwd=testdir, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=120)
              print(result.stdout, flush=True)
              report = result.stdout[-2500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Item conservation packet test::' + report, flush=True)
              result.check_returncode()
              result = subprocess.run(['node', 'drop-integrity.cjs'], cwd=testdir, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=120)
              print(result.stdout, flush=True)
              report = result.stdout[-2500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Drop conservation test::' + report, flush=True)
              result.check_returncode()
              server.stdin.write('stop\n'); server.stdin.flush(); server.wait(timeout=30)
          finally:
              try: os.killpg(server.pid, signal.SIGKILL)
              except ProcessLookupError: pass
              output.close()
              print('\n'.join(pathlib.Path('/tmp/inventory-server.log').read_text(errors='replace').splitlines()[-50:]))
          PY
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-regression-log
          path: /tmp/inventory-server.log
          if-no-files-found: ignore
