name: Package remote spawn test candidate

on:
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/package-remote-spawn-candidate.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run containing the candidate core"
        required: true
        default: "42234510570"

permissions:
  actions: read
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download current built artifacts
        uses: actions/download-artifact@v4
        with:
          name: purpurbedrock-smoke-diagnostics
          path: artifacts
          repository: gulp-tech/Purpurbedrock
          run-id: ${{ inputs.run_id || '42234510570' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create ready ZIP archive
        run: |
          set -euo pipefail
          JAR="$(find artifacts -type f -name 'purpurbedrock-26.2.jar' -print -quit)"
          SHA="$(find artifacts -type f -name 'purpurbedrock-26.2.jar.sha256' -print -quit)"
          test -n "$JAR" && test -s "$JAR"
          test -n "$SHA" && test -s "$SHA"
          cp "$JAR" purpurbedrock-26.2.jar
          cp "$SHA" purpurbedrock-26.2.jar.sha256
          AC="$(find artifacts -type f -name 'PurpurBedrockAC-26.2.jar' -print -quit)"
          ACSHA="$(find artifacts -type f -name 'PurpurBedrockAC-26.2.jar.sha256' -print -quit)"
          test -n "$AC" && test -s "$AC"
          test -n "$ACSHA" && test -s "$ACSHA"
          cp "$AC" PurpurBedrockAC-26.2.jar
          cp "$ACSHA" PurpurBedrockAC-26.2.jar.sha256
          mkdir package
          cp purpurbedrock-26.2.jar package/
          cp purpurbedrock-26.2.jar.sha256 package/
          cat > package/INSTALL.txt <<'EOF'
          Purpurbedrock 26.2

          1. Stop the server completely.
          2. Extract purpurbedrock-26.2.jar into the server root and replace the old core.
          3. Keep transport: both in bedrock.yml.
          4. Start the server. Do not use /reload.
          EOF
          (cd package && zip -9 ../Purpurbedrock-26.2-ready.zip *)
          sha256sum Purpurbedrock-26.2-ready.zip > Purpurbedrock-26.2-ready.zip.sha256

      - name: Publish separate test candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mv purpurbedrock-26.2.jar purpurbedrock-26.2-remote-spawn-test.jar
          sha256sum purpurbedrock-26.2-remote-spawn-test.jar > purpurbedrock-26.2-remote-spawn-test.jar.sha256
          mv Purpurbedrock-26.2-ready.zip Purpurbedrock-26.2-remote-spawn-test.zip
          sha256sum Purpurbedrock-26.2-remote-spawn-test.zip > Purpurbedrock-26.2-remote-spawn-test.zip.sha256
          gh release upload v26.2.0-bedrock \
            purpurbedrock-26.2-remote-spawn-test.jar \
            purpurbedrock-26.2-remote-spawn-test.jar.sha256 \
            Purpurbedrock-26.2-remote-spawn-test.zip \
            Purpurbedrock-26.2-remote-spawn-test.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
